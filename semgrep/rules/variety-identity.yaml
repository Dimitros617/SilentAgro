rules:
  - id: variety-identity
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Odrůdu identifikujte pomocí ID. Název slouží k zobrazení a historickému snapshotu,
      takže po přejmenování ukazuje jinam nebo nikam.
    pattern-either:
      # Výčtem místo jednoho pravidla na metodu: `where: { name }` je identita ve čtení
      # i v zápisu, takže upsert, update i delete patří do stejné sítě jako findUnique.
      - patterns:
          - pattern: "$DB.variety.$METHOD({where: {name: $NAME, ...}, ...})"
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(findFirst|findUnique|findFirstOrThrow|findUniqueOrThrow|update|updateMany|upsert|delete|deleteMany|count)$
      - pattern: "{variety: {connect: {name: $NAME, ...}, ...}, ...}"
      - pattern: "{variety: {connectOrCreate: {where: {name: $NAME, ...}, ...}, ...}, ...}"
