rules:
  - id: detached-transaction
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Na dokončení transakce čekejte pomocí await nebo vraťte její Promise volajícímu.
      Uložení do proměnné nestačí — statická analýza pozdější await nedohledá, takže
      opuštěná transakce vypadá stejně jako ta, na kterou se čeká.
    patterns:
      - pattern: $DB.$transaction(...)
      - pattern-not-inside: await $DB.$transaction(...)
      - pattern-not-inside: return $DB.$transaction(...)
      - pattern-not-inside: $DB.$transaction(...).then(...)
      - pattern-not-inside: "[... , $DB.$transaction(...), ...]"
