# Identifikátory projektu a organizace dodává GitHub Actions přes repository variables.
sonar.projectName=SilentAgro
sonar.sourceEncoding=UTF-8
sonar.sources=src,prisma,scripts,Dockerfile,docker-compose.yml,docker-compose.prod.yml
sonar.tests=tests
sonar.exclusions=prisma/migrations/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json
