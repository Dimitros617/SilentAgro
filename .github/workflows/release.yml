name: Release

on:
  push:
    tags: ['v*']

# Cizí akce připnuté na commit SHA — tahle úloha má právo publikovat image
# a podepisovat ho jménem repozitáře, takže přepsaná značka by dovolila zveřejnit
# cizí obsah pod naším podpisem.
permissions:
  contents: read

jobs:
  publish:
    name: Sestavit, podepsat a zveřejnit image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Nutné pro bezklíčový podpis přes OIDC — cosign si tak nemusí nikde
      # ukládat soukromý klíč.
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: meta-migrator
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: suffix=-migrator,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Migrační image se publikuje zvlášť, protože runtime image `prisma` CLI nenese —
      # `output: 'standalone'` ho do něj nedá a `read_only` rootfs by nedovolil doinstalovat.
      # Bez tohohle kroku by v produkci nešly nasadit migrace vůbec.
      - id: build-migrator
        name: Sestavit a publikovat migrační image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: migrator
          push: true
          tags: ${{ steps.meta-migrator.outputs.tags }}
          labels: ${{ steps.meta-migrator.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Soupis obsahu image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: silentagro-sbom.spdx.json

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Podepisují se oba obrazy. Migrační se v produkci pouští proti ostré
      # databázi a zakládá účet farmáře, takže na nepodepsaný není důvod spoléhat
      # o nic míň než na runtime.
      - name: Podepsat obrazy
        run: |
          cosign sign --yes \
            "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
          cosign sign --yes \
            "ghcr.io/${{ github.repository }}@${{ steps.build-migrator.outputs.digest }}"
