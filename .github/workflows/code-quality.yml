name: Code quality review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-analyzers:
    name: Statická analýza, architektura a kvalita testů
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # Každá kontrola musí doběhnout i po pádu té předchozí — jinak se neuloží
      # reporty, kvůli kterým se workflow spouští.
      - name: Testy architektonických pravidel
        if: ${{ !cancelled() }}
        run: npm run quality:architecture:test
      - name: Kvalita zdrojového kódu
        if: ${{ !cancelled() }}
        run: npm run quality:scan
      - name: Závislosti a konfigurace
        if: ${{ !cancelled() }}
        run: npm run quality:trivy
      - name: Ověření pravidel Semgrepu
        if: ${{ !cancelled() }}
        run: npm run quality:semgrep:test
      - name: Semgrep
        if: ${{ !cancelled() }}
        run: npm run quality:semgrep
      - name: Mutační testování
        if: ${{ !cancelled() }}
        run: npm run quality:mutation
      - name: Pokrytí testy
        if: ${{ !cancelled() }}
        run: npm test -- --coverage
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: code-quality-reports
          path: |
            reports/quality/
            coverage/
          retention-days: 14
