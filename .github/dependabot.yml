version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Aktualizace Next.js, React a Prismy dávají smysl jen pohromadě — rozdělené
      # do samostatných PR by se navzájem shazovaly na typech.
      next:
        patterns: ['next', 'eslint-config-next', 'react', 'react-dom', '@types/react*']
      prisma:
        patterns: ['prisma', '@prisma/*']
      vyvojove-nastroje:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: weekly
